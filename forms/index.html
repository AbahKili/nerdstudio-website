<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nerd Studio Form Constructor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a}
iframe{width:100vw;height:100vh;border:none}
.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#94a3b8;font-family:system-ui;text-align:center}
.spinner{width:40px;height:40px;border:3px solid #334155;border-top-color:#22c55e;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>Memuat Nerd Studio Form Constructor...</div>
</div>
<iframe src="https://script.google.com/macros/s/AKfycbzuU665vUEZM0CsfFRbsf2gUz_iSo9SH0nlNiZIDfJWdVy2MoHc-ASX0pdkgRl--cYX/exec" onload="document.getElementById('loading').style.display='none'" allow="camera;microphone"></iframe>
</body>
</html>
