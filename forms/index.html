<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nerd Studio Form Constructor</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0f172a;
    color:#e2e8f0;
    font-family:system-ui,-apple-system,sans-serif;
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;text-align:center;padding:24px;
  }
  .card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:16px;
    padding:40px 32px;
    max-width:420px;width:100%;
  }
  .logo{font-size:20px;font-weight:700;color:#22c55e;margin-bottom:8px}
  .sub{color:#64748b;font-size:14px;margin-bottom:24px}
  .spinner{
    width:40px;height:40px;
    border:3px solid #334155;border-top-color:#22c55e;
    border-radius:50%;animation:spin .8s linear infinite;
    margin:0 auto 20px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{
    display:inline-block;background:#22c55e;color:#0f172a;
    font-weight:600;padding:12px 28px;border-radius:8px;
    text-decoration:none;font-size:15px;transition:background .2s;
    border:none;cursor:pointer;
  }
  .btn:hover{background:#16a34a}
  .note{color:#64748b;font-size:13px;margin-top:16px}
</style>
<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyZMZ-MnjpexX0EgDnCXnCbvA9-fASWeHftu3T8hy5cpVYKSkjb1N2Eg3zucFlhaH5u/exec';
  // Auto-redirect after brief delay to show branding
  setTimeout(function(){
    window.location.href = GAS_URL;
  }, 1200);
</script>
</head>
<body>
<div class="card">
  <div class="logo">Nerd Studio</div>
  <div class="sub">Form Constructor</div>
  <div class="spinner"></div>
  <p style="margin-bottom:16px">Mengalihkan ke form builder&hellip;</p>
  <a class="btn" href="https://script.google.com/macros/s/AKfycbyZMZ-MnjpexX0EgDnCXnCbvA9-fASWeHftu3T8hy5cpVYKSkjb1N2Eg3zucFlhaH5u/exec" target="_blank">
    Buka di tab baru →
  </a>
  <p class="note">Google login diperlukan untuk membuat form.<br>Gunakan tombol di atas jika redirect tidak berfungsi.</p>
</div>
</body>
</html>
