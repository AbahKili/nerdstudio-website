# Block sensitive paths first (before any location / block)
server {
    server_name nerdstudio.online www.nerdstudio.online;

    root /var/www/nerdstudio.online;
    index index.html;

    # Block access to sensitive paths
    location ~ /\.(git|env|svn|hg|htaccess) {
        return 404;
    }

    # Main location
    location / {
        try_files $uri $uri/ =404;
        # Security headers in location block (inherits properly)
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nerdstudio.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nerdstudio.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.nerdstudio.online) {
        return 301 https://$host$request_uri;
    }

    if ($host = nerdstudio.online) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name nerdstudio.online www.nerdstudio.online;
    return 404;
}
# Hide nginx version in ALL server blocks
