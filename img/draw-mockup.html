<!DOCTYPE html><html><head><style>
body{margin:0;font-family:system-ui;background:#0f172a;overflow:hidden}
.toolbar{position:absolute;top:12px;left:12px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:8px;display:flex;gap:6px;z-index:10}
.tool{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#94a3b8}
.tool:hover,.tool.active{background:#22c55e20;color:#22c55e}
.canvas{width:100vw;height:100vh;background:#0f172a;position:relative}
.shape{position:absolute;border:2px solid}
.rect1{left:80px;top:60px;width:200px;height:120px;border-color:#3b82f6;border-radius:8px;background:#3b82f610}
.rect2{left:350px;top:200px;width:180px;height:100px;border-color:#22c55e;border-radius:8px;background:#22c55e10}
.rect3{left:200px;top:350px;width:240px;height:90px;border-color:#f59e0b;border-radius:8px;background:#f59e0b10}
.arrow{position:absolute;color:#94a3b8;font-size:24px}
.a1{left:270px;top:130px;transform:rotate(45deg)}
.a2{left:230px;top:290px;transform:rotate(-20deg)}
.label{position:absolute;font-size:0.8rem;color:#f8fafc;padding:4px 8px;background:#1e293b;border-radius:4px}
.l1{left:120px;top:95px}
.l2{left:390px;top:235px}
.l3{left:230px;top:380px}
.cursor{position:absolute;left:500px;top:150px;color:#22c55e;font-size:20px}
</style></head><body>
<div class="toolbar">
<div class="tool active">✋</div><div class="tool">⬜</div><div class="tool">🔵</div><div class="tool">✏️</div><div class="tool">📝</div><div class="tool">🔗</div>
</div>
<div class="canvas">
<div class="shape rect1"></div><div class="label l1">Authentication Flow</div>
<div class="shape rect2"></div><div class="label l2">Database Schema</div>
<div class="shape rect3"></div><div class="label l3">API Endpoints</div>
<div class="arrow a1">→</div><div class="arrow a2">→</div>
<div class="cursor">🖱️</div>
</div>
</body></html>
